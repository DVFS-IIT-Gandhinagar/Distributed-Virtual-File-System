name: CD

on:
  push:
    branches: [ "tls" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  push_to_registry:
    name: Push Docker image to GitHub Packages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Lowercase Repository Owner Name
        run: |
          echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/dvfs:latest

  build_release_binaries:
    name: Build release binaries (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-amd64
            goos: darwin
            goarch: amd64
            ext: ""
            archive: tar.gz
          - target: macos-arm64
            goos: darwin
            goarch: arm64
            ext: ""
            archive: tar.gz
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
            archive: tar.gz
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: .exe
            archive: zip
          - target: android-linux-arm64
            goos: android
            goarch: arm64
            ext: ""
            archive: tar.gz
          - target: android-linux-amd64
            goos: android
            goarch: amd64
            ext: ""
            archive: tar.gz
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          OUT_DIR="dist/dvfs-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$OUT_DIR"

          go build -trimpath -o "$OUT_DIR/metaserver${{ matrix.ext }}" ./cmd/metaserver
          go build -trimpath -o "$OUT_DIR/fileserver${{ matrix.ext }}" ./cmd/fileserver
          go build -trimpath -o "$OUT_DIR/client${{ matrix.ext }}" ./cmd/client

      - name: Package archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          set -euo pipefail
          mkdir -p dist/releases
          ARCHIVE="dist/releases/dvfs-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          tar -C dist -czf "$ARCHIVE" "dvfs-${GITHUB_REF_NAME}-${{ matrix.target }}"

      - name: Package archive (zip)
        if: matrix.archive == 'zip'
        run: |
          set -euo pipefail
          mkdir -p dist/releases
          ARCHIVE="dist/releases/dvfs-${GITHUB_REF_NAME}-${{ matrix.target }}.zip"
          cd dist
          zip -r "../$ARCHIVE" "dvfs-${GITHUB_REF_NAME}-${{ matrix.target }}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/releases/*

  publish_release:
    name: Publish GitHub Release assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - build_release_binaries
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/releases

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/releases/*
          generate_release_notes: true
