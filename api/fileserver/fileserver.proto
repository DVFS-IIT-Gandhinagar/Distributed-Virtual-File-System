syntax = "proto3";

package fileserver;

option go_package = "github.com/umangshikarvar/dvfs/api/fileserver";

// File Identifier
message FID {
  string file_server_id = 1;
  uint64 inode_id = 2;
  uint64 generation_number = 3;
}

// Access Control List
message ACL {
  repeated string read_users = 1;
  repeated string write_users = 2;

}

// File/Directory Type
enum InodeType {
  FILE = 0;
  DIRECTORY = 1;
}

// === File Operations ===
message CreateFileRequest {
  string name = 1;
  FID fid = 2;
  InodeType type = 3;
  string root_user = 4;
}

message CreateFileResponse {
  FID fid = 1;
  bool success = 2;
  string error = 3;
}

message OpenFileRequest {
  FID fid = 1;
  string client_id = 2; // for callbacks
}

message OpenFileResponse {
  bool success = 1;
  string error = 2;
  uint64 file_size = 3;
  uint64 version = 4; // for cache validation
}

message ReadFileRequest {
  FID parentFid = 1;
  string name = 2;
  uint64 offset = 3;
  uint64 length = 4;
}

message ReadFileResponse {
  bytes data = 1;
  bool success = 2;
  string error = 3;
}

message WriteFileRequest {
  FID parentFid = 1;
  string name = 2;
  uint64 offset = 3;
  bytes data = 4;
}

message WriteFileResponse {
  bool success = 1;
  string error = 2;
  uint64 version = 3; // new version after write
}

message CloseFileRequest {
  FID fid = 1;
  string client_id = 2;
}

message CloseFileResponse {
  bool success = 1;
  string error = 2;
}

message DeleteFileRequest {
  FID fid = 1;
  bool recursive = 2; // if true, allows deletion of non-empty directories
  string root_user = 3;
}

message DeleteFileResponse {
  bool success = 1;
  string error = 2;
}

// Move a file/directory to the user's trash (soft delete)
message TrashFileRequest {
  FID fid = 1;
  bool recursive = 2; // if true, allows trashing non-empty directories
  string root_user = 3;
}

message TrashFileResponse {
  bool success = 1;
  string error = 2;
  string trashed_name = 3; // final name inside trash (may differ on collision)
}

// Restore a file/directory from trash back to its original location
message RestoreFileRequest {
  FID fid = 1;
  string root_user = 2;
}

message RestoreFileResponse {
  bool success = 1;
  string error = 2;
  string restored_name = 3; // final restored name (may differ on collision)
}

message GetAttrRequest {
  FID fid = 1;
}

message GetAttrResponse {
  bool success = 1;
  string error = 2;
  string name = 3;
  InodeType type = 4;
  uint64 size = 5;
  uint64 version = 6;
}

message PathRequest {
  FID fid = 1;
  string root_user = 2;
}

message PathResponse {
  string path =1;
  bool success = 2;
  string error = 3;
}

message ChangeDirRequest {
  FID fid = 1;
  FID root_fid = 2;
  string path = 3;
}

message ChangeDirResponse {
  bool success = 1;
  string error = 2;
  FID new_fid = 3; // FID of new directory
}

message ListDirRequest {
  FID fid = 1;
}

message DirEntry {
  FID fid = 1;
  string name = 2;
  InodeType type = 3;
  uint64 size = 4;
}

message ListDirResponse {
  bool success = 1;
  string error = 2;
  repeated DirEntry entries = 3;
}

message LookupRequest {
  FID parent_fid = 1;
  string name = 2;
}

message LookupResponse {
  bool success = 1;
  string error = 2;
  FID fid = 3;
}

message UploadFileRequest {
  FID parentFid = 1;
  string name = 2;
  uint64 offset = 3;
  string user = 4;
  bytes chunk = 5; // file data chunk
}

message UploadFileResponse {
  bool success = 1;
  string error = 2;
}

message DownloadFileRequest {
  FID parentFid = 1;
  string name = 2;
}

message DownloadFileResponse {
  bool success = 1;
  string error = 2;
  uint64 offset = 3;
  bytes chunk = 4;
}

message ShareRequest {
  string username = 1; // username for access control
  FID fid = 2; // FID of root which client is using
  string share_with = 3; // username of the user to share with
}

message ShareResponse {
  bool success = 1;
  string error = 2;
}

message UnshareRequest {
  string username = 1; // username for access control
  FID fid = 2; // FID of root which client is using
  string unshare_with = 3; // username of the user to share with
}

message UnshareResponse {
  bool success = 1;
  string error = 2;
}

message RegisterClientRequest {
  string client_id = 1;
  string callback_address = 2; // host:port for callbacks
  string username = 3; // username for access control
  string root_user = 4; // root user
  string root_path = 5; // path of the root
}

message RegisterClientResponse {
  bool success = 1;
  string error = 2;
  FID user_root_fid = 3; // FID of user's root directory
}

// FileServer service
service FileServer {
  rpc RegisterClient(RegisterClientRequest) returns (RegisterClientResponse);
  rpc CreateFile(CreateFileRequest) returns (CreateFileResponse);
  rpc OpenFile(OpenFileRequest) returns (OpenFileResponse);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
  rpc CloseFile(CloseFileRequest) returns (CloseFileResponse);
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  rpc TrashFile(TrashFileRequest) returns (TrashFileResponse);
  rpc RestoreFile(RestoreFileRequest) returns (RestoreFileResponse);
  rpc GetAttr(GetAttrRequest) returns (GetAttrResponse);
  rpc ListDir(ListDirRequest) returns (ListDirResponse);
  rpc Lookup(LookupRequest) returns (LookupResponse);
  rpc Path(PathRequest) returns (PathResponse);
  rpc ChangeDir(ChangeDirRequest) returns (ChangeDirResponse);
  rpc UploadFile(stream UploadFileRequest) returns (UploadFileResponse);
  rpc DownloadFile(DownloadFileRequest) returns (stream DownloadFileResponse);
  rpc Share(ShareRequest) returns (ShareResponse);
  rpc Unshare(UnshareRequest) returns (UnshareResponse);
}

// To build these run: make proto