syntax = "proto3";

package callback;

option go_package = "github.com/umangshikarvar/dvfs/api/callback";

import "api/fileserver/fileserver.proto";

// Callback messages for cache invalidation
message InvalidateRequest {
  fileserver.FID fid = 1;
  uint64 new_version = 2;
}

message InvalidateResponse {
  bool success = 1;
}

// ClientCallback service (runs on client)
service ClientCallback {
  rpc Invalidate(InvalidateRequest) returns (InvalidateResponse);
}
