syntax = "proto3";

package metaserver;

option go_package = "github.com/umangshikarvar/dvfs/api/metaserver";

message SharedDir {
  string path = 1;           // Full path including username (e.g., "/umang", "/umang/proj")
  repeated string users = 2; // Users with explicit access to this directory
  string name = 3;
  string owner = 4;
}

message SharedRoot {
  string path = 1;
  string display_name = 2;
  string owner = 3;
}

message RegisterFileServerRequest {
  string address = 1;
  repeated string users = 2;
  repeated SharedDir shared = 3; // ACL information for each user
}

message RegisterFileServerResponse {
  bool success = 1;
  string error = 2;
}

message NavigateRequest {
  string username = 1;
  string root_user = 2;
}

message NavigateResponse {
  bool success = 1;
  string error = 2;
  string address = 3; // address of the file server to connect to
}

message GetRootsRequest {
  string username = 1;
}

message GetRootsResponse {
  bool success = 1;
  string error = 2;
  repeated SharedRoot roots = 3;
}

message RootShareRequest {
  string root_path = 1;
  string owner = 2;
  string share_with = 3;
  string name = 4;
}

message RootShareResponse {
  bool success = 1;
  string error = 2;
}

message RootUnshareRequest {
  string root_path = 1;
  string owner = 2;
  string unshare_with = 3;
  string name = 4;
}

message RootUnshareResponse {
  bool success = 1;
  string error = 2;
}

message HeartbeatRequest {
  string address = 1;
}

message HeartbeatResponse {
  bool success = 1;
  string error = 2;
}

// MetaServer service
service MetaServer {
  rpc RegisterFileServer(RegisterFileServerRequest) returns (RegisterFileServerResponse);
  rpc Navigate(NavigateRequest) returns (NavigateResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc GetRoots(GetRootsRequest) returns (GetRootsResponse);
  rpc RootShare(RootShareRequest) returns (RootShareResponse);
  rpc RootUnshare(RootUnshareRequest) returns (RootUnshareResponse);
}