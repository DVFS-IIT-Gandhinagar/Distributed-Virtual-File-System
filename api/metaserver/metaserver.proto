syntax = "proto3";

package metaserver;

option go_package = "github.com/DVFS-IIT-Gandhinagar/Distributed-Virtual-File-System/api/metaserver";

message SharedDir {
  string path = 1;           // Full path including username (e.g., "/umang", "/umang/proj")
  repeated string users = 2; // Users with explicit access to this directory
  string name = 3;
  string owner = 4;
}

message SharedRoot {
  string path = 1;
  string display_name = 2;
  string owner = 3;
}

message RegisterFileServerRequest {
  string address = 1;
  repeated string users = 2;
  repeated SharedDir shared = 3; // ACL information for each user
}

message RegisterFileServerResponse {
  bool success = 1;
  string error = 2;
}

message NavigateRequest {
  string username = 1;
  string root_user = 2;
}

message NavigateResponse {
  bool success = 1;
  string error = 2;
  string address = 3; // address of the file server to connect to
}

message GetRootsRequest {
  string username = 1;
}

message GetRootsResponse {
  bool success = 1;
  string error = 2;
  repeated SharedRoot roots = 3;
}

message RootShareRequest {
  string root_path = 1;
  string owner = 2;
  string share_with = 3;
  string name = 4;
}

message RootShareResponse {
  bool success = 1;
  string error = 2;
}

message RootUnshareRequest {
  string root_path = 1;
  string owner = 2;
  string unshare_with = 3;
  string name = 4;
}

message RootUnshareResponse {
  bool success = 1;
  string error = 2;
}

message HeartbeatRequest {
  string address = 1;
}

message HeartbeatResponse {
  bool success = 1;
  string error = 2;
}

message DeregisterFileServerRequest {
  string address = 1;
}

message DeregisterFileServerResponse {
  bool success = 1;
  string error = 2;
}

// Cluster management & consensus messages
message JoinClusterRequest {
  string node_id = 1;
  string raft_addr = 2;
}

message JoinClusterResponse {
  bool success = 1;
  string error = 2;
}

message LeaderInfoRequest {}

message LeaderInfoResponse {
  bool is_leader = 1;
  string leader_id = 2;
  string leader_addr = 3;
  string raft_state = 4;
  repeated string peers = 5;
}

message FileServerEntry {
  uint64 fs_id = 1;
  string address = 2;
  int64 user_count = 3;
  int64 last_heartbeat_unix = 4;
  string status = 5;
}

message SharedDirEntryProto {
  string owner = 1;
  string path = 2;
  string display_name = 3;
}

message UserSharedRoots {
  repeated SharedDirEntryProto roots = 1;
}

message ClusterStateRequest {}

message ClusterStateResponse {
  bool success = 1;
  string error = 2;
  repeated FileServerEntry fileservers = 3;
  map<string, uint64> users = 4;
  map<string, UserSharedRoots> shared = 5;
  uint64 next_fs_id = 6;
}

// MetaServer service
service MetaServer {
  rpc RegisterFileServer(RegisterFileServerRequest) returns (RegisterFileServerResponse);
  rpc Navigate(NavigateRequest) returns (NavigateResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc GetRoots(GetRootsRequest) returns (GetRootsResponse);
  rpc RootShare(RootShareRequest) returns (RootShareResponse);
  rpc RootUnshare(RootUnshareRequest) returns (RootUnshareResponse);
  rpc DeregisterFileServer(DeregisterFileServerRequest) returns (DeregisterFileServerResponse);
  rpc JoinCluster(JoinClusterRequest) returns (JoinClusterResponse);
  rpc LeaderInfo(LeaderInfoRequest) returns (LeaderInfoResponse);
  rpc GetClusterState(ClusterStateRequest) returns (ClusterStateResponse);
}