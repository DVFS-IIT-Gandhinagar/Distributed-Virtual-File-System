site_name: DVFS - Distributed Virtual File System
site_description: High-Performance, AFS-Inspired Distributed Virtual File System with Zero-Trust PKI
site_author: DVFS Team
repo_url: https://github.com/DVFS-IIT-Gandhinagar/Distributed-Virtual-File-System
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Setup Guide: setup.md
  - Architecture: architecture.md
  - Features & Subsystems:
      - Client Caching: features/caching.md
      - Sharing & Access Control: features/sharing_acls.md
      - Crash Recovery & Inodes: features/crash_recovery.md
      - Recycle Bin & Trash: features/trash.md
      - Dynamic Storage Quotas: features/quotas.md
      - Zero-Trust TLS & PKI: features/tls_security.md
      - Telemetry & Performance: features/admin_telemetry.md
      - Remote Orchestration & Alerts: features/cluster_orchestration.md
      - Authentication & Security: features/authentication.md
  - Client CLI Reference: client_cli.md
  - Architecture Diagrams:
      - Master Overview: diagrams/overview.md
      - Admin Console: diagrams/admin_system.md
      - FileServer Engine: diagrams/fileserver_engine.md
      - MetaServer Coordinator: diagrams/metaserver_coordinator.md
      - Client & Cache: diagrams/client_system.md
      - Zero-Trust PKI & Network: diagrams/tls_and_network.md
  - Project Artifacts: artifacts.md
